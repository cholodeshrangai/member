<head>

<title>চলো দেশ রাঙাই</title>
<style>
:root{--ink:#1d2433;--muted:#5b6478;--c1:#1aa7e0;--c2:#f58220;--c3:#7ac143;--c4:#e0262b;--c5:#7b2d8e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;color:var(--ink);background:linear-gradient(135deg,#eaf7fd,#fff4e8 50%,#f1f9e8);background-size:200% 200%;animation:flow 14s ease infinite}
.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 18px 50px rgba(30,40,80,.15);border-top:6px solid;border-image:linear-gradient(90deg,var(--c1),var(--c3),var(--c2),var(--c4),var(--c5)) 1}
img{width:150px;height:150px;object-fit:contain}
h1{margin:12px 0 4px;font-size:1.7rem}
p{margin:0 0 20px;color:var(--muted);line-height:1.5}
a.btn{display:block;padding:15px 18px;border-radius:16px;color:#fff;font-weight:700;font-size:1.1rem;text-decoration:none;background:linear-gradient(135deg,var(--c1),var(--c5));box-shadow:0 8px 20px rgba(26,167,224,.35);transition:transform .15s}
a.btn:hover{transform:translateY(-3px)}
small{display:block;margin-top:16px;color:var(--muted)}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@media (prefers-reduced-motion:reduce){body{animation:none}a.btn{transition:none}}
</style>
